<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>FlexDesk — standalone demo</title>

    <!-- The library's OWN stylesheets, from its dist/. Not one file here comes from
         EcoAgent. The demo loads exactly what an npm consumer loads:
         - tokens.css   the theming layer (every twm rule reads var(--…) from here;
                        swap this one file and the whole shell restyles)
         - reset.css    the reset
         - flexdesk.css GENERATED by scripts/css_extract.py, which decides ownership
                        by USE — which JS applies a class — not by filename
         If the shell renders styled, the library's styling ships. It did not, once:
         the DataTable came up in a serif font with no borders, because `.preview-table`
         was reached through a ternary that the ownership scanner could not see. -->
    <script type="importmap">
    {
        "imports": {
            "@flexdesk/core": "../dist/core.js",
            "@flexdesk/host": "../dist/host.js",
            "@flexdesk/wm": "../dist/wm.js",
            "@flexdesk/widgets": "../dist/widgets.js"
        }
    }
    </script>

    <!-- The icon font is an OPTIONAL asset FlexDesk does not ship (Apache-2.0,
         Google). Without it the icons render as their text names and nothing
         breaks — which is the point. Served from Google Fonts here. -->
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <link href="../dist/tokens.css" rel="stylesheet" />
    <link href="../dist/reset.css" rel="stylesheet" />
    <link href="../dist/flexdesk.css" rel="stylesheet" />

    <style>
        /* The demo's own layout. Everything else is the library's. */
        html, body { height: 100%; margin: 0; overflow: hidden; }
        body {
            background: var(--surface-0);
            color: var(--text-1);
            font-family: var(--font-ui, system-ui, sans-serif);
            font-size: var(--font-size-md, 13px);
            display: flex; flex-direction: column;
        }
        #demo-root { flex: 1 1 0; min-height: 0; position: relative; }
        .twm-global-top-bar, .twm-global-bottom-bar {
            display: flex; align-items: center; justify-content: space-between;
            gap: var(--space-3, 8px); padding: 0 var(--space-3, 8px);
            background: var(--surface-1); border-bottom: 1px solid var(--border-1);
            flex: 0 0 auto; height: 36px;
        }
        .twm-global-bottom-bar { border-bottom: 0; border-top: 1px solid var(--border-1); height: 28px; }
        .twm-bar-left, .twm-bar-center, .twm-bar-right { display: flex; align-items: center; gap: 6px; }
        .twm-brand { font-weight: 600; letter-spacing: .04em; color: var(--text-2); }
        .twm-status { color: var(--text-3); font-size: var(--font-size-sm, 11px); }
    </style>
</head>
<body class="twm-body">
    <!-- The chrome. createShell paints into ELEMENTS you hand it — never into a
         selector it guessed. An embedder that wants no chrome passes `chrome: {}`
         and gets a bare WM; this one wants the lot. -->
    <div class="twm-global-top-bar">
        <div class="twm-bar-left">
            <span class="twm-brand">FlexDesk</span>
            <span id="palette-btn"></span>
        </div>
        <div class="twm-bar-center" id="top-nav"></div>
        <div class="twm-bar-right" id="panel-toggles"></div>
    </div>

    <div id="demo-root"></div>

    <div class="twm-global-bottom-bar">
        <div class="twm-bar-left"><span class="twm-status">standalone — mock host, no backend</span></div>
        <div class="twm-bar-right" id="desktops"></div>
    </div>

    <script type="module" src="./demo.js"></script>
</body>
</html>
